<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .loading {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .banner {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .banner h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .banner p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .hidden {
      display: none;
    }
  </style>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <!-- State 1: Loading -->
    <div id="loading-state" class="loading">Loading your bookings...</div>

    <!-- State 2: Dynamic Re-booking Banner -->
    <div id="rebook-banner" class="banner hidden">
      <h2 id="banner-title"></h2>
      <p id="banner-description"></p>
      <button id="rebook-button" class="btn">Book Again</button>
    </div>

    <!-- State 3: Empty State (No previous bookings found) -->
    <div id="empty-state" class="banner hidden">
      <h2>Welcome back!</h2>
      <p>You don't have any previous bookings yet.</p>
      <button class="btn" onclick="location.href='/book'">Find a Provider</button>
    </div>
  </div>

  <script>
    // 1. Initialize Supabase Client dynamically
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadLatestBooking() {
      const loadingEl = document.getElementById("loading-state");
      const bannerEl = document.getElementById("rebook-banner");
      const emptyEl = document.getElementById("empty-state");
      const titleEl = document.getElementById("banner-title");
      const descEl = document.getElementById("banner-description");
      const buttonEl = document.getElementById("rebook-button");

      try {
        // 2. Fetch active user session
        const { data: { user }, error: authError } = await supabase.auth.getUser();

        if (authError || !user) {
          showEmptyState(loadingEl, emptyEl);
          return;
        }

        // 3. Fetch latest booking dynamically from DB
        const { data: bookings, error } = await supabase
          .from("bookings")
          .select("provider_name, provider_id, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(1);

        // Hide loading state
        loadingEl.classList.add("hidden");

        if (error || !bookings || bookings.length === 0) {
          // No records found in Supabase -> Display empty state
          emptyEl.classList.remove("hidden");
          return;
        }

        // 4. Render dynamically using actual database values (No hardcoding)
        const latestBooking = bookings[0];
        const providerName = latestBooking.provider_name;

        titleEl.textContent = `Book with ${providerName} again?`;
        descEl.textContent = `Schedule your next session with ${providerName}.`;
        buttonEl.onclick = () => {
          window.location.href = `/book?provider_id=${latestBooking.provider_id}`;
        };

        bannerEl.classList.remove("hidden");

      } catch (err) {
        console.error("Failed to load booking data:", err);
        showEmptyState(loadingEl, emptyEl);
      }
    }

    function showEmptyState(loadingEl, emptyEl) {
      loadingEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
    }

    // Run fetching on DOM ready
    document.addEventListener("DOMContentLoaded", loadLatestBooking);
  </script>
</body>
</html>
