<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .state-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .state-container h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .state-container p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .error-text {
      color: var(--danger) !important;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <!-- 1. Loading State -->
    <div id="loading-state" class="state-container">
      <p>Loading your bookings...</p>
    </div>

    <!-- 2. Configuration Error State (Fires if keys are missing) -->
    <div id="config-error-state" class="state-container hidden">
      <h2 class="error-text">Setup Required</h2>
      <p>Please enter your Supabase URL and Anon Key in the code to connect to your database.</p>
    </div>

    <!-- 3. Auth Error State (Fires if user is not logged in) -->
    <div id="auth-error-state" class="state-container hidden">
      <h2>Not Logged In</h2>
      <p>You must be logged in to view your bookings.</p>
      <button class="btn" onclick="location.href='/login'">Go to Login</button>
    </div>

    <!-- 4. Empty State (Fires if database returns no records) -->
    <div id="empty-state" class="state-container hidden">
      <h2>Welcome back!</h2>
      <p>You don't have any previous bookings yet.</p>
      <button class="btn" onclick="location.href='/book'">Find a Provider</button>
    </div>

    <!-- 5. Dynamic Data State (Fires on success, NO hardcoding) -->
    <div id="rebook-banner" class="state-container hidden">
      <h2 id="banner-title"></h2>
      <p id="banner-description"></p>
      <button id="rebook-button" class="btn">Book Again</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. ADD YOUR SUPABASE CREDENTIALS HERE
    // ==========================================
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    // Helper function to handle UI switching safely
    function showState(stateIdToShow) {
      const states = [
        "loading-state", 
        "config-error-state", 
        "auth-error-state", 
        "empty-state", 
        "rebook-banner"
      ];
      
      states.forEach(id => {
        const el = document.getElementById(id);
        if (id === stateIdToShow) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
    }

    async function initializeDashboard() {
      // Check if user forgot to update the keys
      if (SUPABASE_URL === "YOUR_SUPABASE_URL" || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
        showState("config-error-state");
        return;
      }

      try {
        // Initialize Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch active user session
        const { data: { user }, error: authError } = await supabase.auth.getUser();

        if (authError || !user) {
          console.warn("User is not logged in.");
          showState("auth-error-state");
          return;
        }

        // Fetch latest booking dynamically (Strictly getting data, no hardcoded fallback)
        const { data: bookings, error: dbError } = await supabase
          .from("bookings")
          .select("provider_name, provider_id, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(1);

        if (dbError) {
          console.error("Database query error:", dbError.message);
          showState("empty-state"); // Fallback to empty state on DB error
          return;
        }

        // If the array is empty, the user has never booked before
        if (!bookings || bookings.length === 0) {
          showState("empty-state");
          return;
        }

        // Render dynamically using actual database values
        const latestBooking = bookings[0];
        
        // Safety check: ensure provider_name actually exists in the row
        if (!latestBooking.provider_name) {
          showState("empty-state");
          return;
        }

        const providerName = latestBooking.provider_name;

        // Inject dynamic text into HTML
        document.getElementById("banner-title").textContent = `Book with ${providerName} again?`;
        document.getElementById("banner-description").textContent = `Schedule your next session with ${providerName}.`;
        
        document.getElementById("rebook-button").onclick = () => {
          // Adjust this URL structure to match your actual booking page setup
          window.location.href = `/book?provider_id=${latestBooking.provider_id}`;
        };

        // Show the banner now that data is injected
        showState("rebook-banner");

      } catch (err) {
        console.error("Unexpected script error:", err);
        showState("empty-state");
      }
    }

    // Run fetching automatically when the page loads
    document.addEventListener("DOMContentLoaded", initializeDashboard);
  </script>
</body>
</html>
