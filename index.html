<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .state-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .state-container h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .state-container p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <div id="loading-state" class="state-container">
      <p>Loading your bookings...</p>
    </div>

    <div id="auth-error-state" class="state-container hidden">
      <h2>Not Logged In</h2>
      <p>You must be logged in to view your bookings.</p>
      <button class="btn" onclick="location.href='/login'">Go to Login</button>
    </div>

    <div id="empty-state" class="state-container hidden">
      <h2>Welcome back!</h2>
      <p>You don't have any previous bookings yet.</p>
      <button class="btn" onclick="location.href='/book'">Find a Provider</button>
    </div>

    <div id="rebook-banner" class="state-container hidden">
      <h2 id="banner-title"></h2>
      <p id="banner-description"></p>
      <button id="rebook-button" class="btn">Book Again</button>
    </div>
  </div>

  <script>
    // ==========================================
    // YOUR SUPABASE CREDENTIALS INJECTED
    // ==========================================
    const SUPABASE_URL = "https://quqcgjkbvajcltwuoqvz.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1cWNnamtidmFqY2x0d3VvcXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NzA5NzAsImV4cCI6MjEwODA0Njk3MH0.vgyqxohnpALs4DTUHfzig7AqzYtOR5SjA67GGHoFtIo";

    function showState(stateIdToShow) {
      const states = [
        "loading-state", 
        "auth-error-state", 
        "empty-state", 
        "rebook-banner"
      ];
      
      states.forEach(id => {
        const el = document.getElementById(id);
        if (id === stateIdToShow) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
    }

    async function initializeDashboard() {
      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { user }, error: authError } = await supabase.auth.getUser();

        if (authError || !user) {
          showState("auth-error-state");
          return;
        }

        const { data: bookings, error: dbError } = await supabase
          .from("bookings")
          .select("provider_name, provider_id, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(1);

        if (dbError || !bookings || bookings.length === 0 || !bookings[0].provider_name) {
          showState("empty-state");
          return;
        }

        const latestBooking = bookings[0];
        const providerName = latestBooking.provider_name;

        document.getElementById("banner-title").textContent = `Book with ${providerName} again?`;
        document.getElementById("banner-description").textContent = `Schedule your next session with ${providerName}.`;
        
        document.getElementById("rebook-button").onclick = () => {
          window.location.href = `/book?provider_id=${latestBooking.provider_id}`;
        };

        showState("rebook-banner");

      } catch (err) {
        console.error("Unexpected script error:", err);
        showState("empty-state");
      }
    }

    document.addEventListener("DOMContentLoaded", initializeDashboard);
  </script>
</body>
</html>
