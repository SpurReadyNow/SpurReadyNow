<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPUR | Show Up Ready</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="manifest" href="manifest.json">
    
    <!-- Load Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold: #d4af37;
            --silver: #a0a0a0;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: #141414;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 35px 20px;
            position: relative;
        }

        /* TOP VIP PILL */
        .vip-top-pill {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 10px 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .vip-top-pill:hover {
            border-color: var(--gold);
        }

        .vip-pill-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .vip-star {
            color: var(--gold);
            font-size: 11px;
        }

        .vip-pill-right {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* Top Header Layout */
        .header-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 35px;
        }

        .logo-area h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 6px;
        }

        .logo-area span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .top-right-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
