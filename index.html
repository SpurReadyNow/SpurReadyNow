<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPUR | Show Up Ready</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: #141414;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        /* Top Header Layout */
        .header-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 45px;
            padding-top: 10px;
        }

        .logo-area h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 6px;
        }

        .logo-area span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .top-right-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
        }

        .controls-row {
            display: flex;
            gap: 8px;
        }

        .toggle-capsule {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .toggle-capsule button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 3px;
            transition: color 0.2s ease;
        }

        .toggle-capsule button.active {
            color: var(--gold);
        }

        .toggle-capsule span {
            color: #444;
            margin: 0 3px;
            font-size: 11px;
        }

        /* Main Content */
        .main-content {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-section {
            width: 100%;
            text-align: left;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .hero-title-gold {
            font-size: 28px;
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            color: var(--gold);
        }

        /* Call To Action Area */
        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 20px;
            margin-bottom: 40px;
        }

        @keyframes breathing {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            50% { transform: scale(1.04); box-shadow: 0 0 35px rgba(212, 175, 55, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        }

        .ready-circle-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #0d0d0d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            animation: breathing 3s infinite ease-in-out;
            margin: 10px auto 5px auto;
            text-align: center;
            transition: transform 0.1s ease;
        }

        .ready-circle-btn:active {
            transform: scale(0.96);
        }

        .ready-line-1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-left: 1px;
        }

        .ready-line-2 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1.5px;
            line-height: 1.1;
        }

        .cta-footer-note {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-align: center;
            margin-top: 8px;
        }

        .ready-later-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ready-later-btn:active {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .returning-prompt {
            margin-top: 10px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }
        
        .returning-prompt p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        
        .returning-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: rgba(212, 175, 55, 0.4);
            text-underline-offset: 4px;
        }

        /* Feature Section & Pricing */
        .feature-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .feature-header {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        .price-showcase {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-val {
            font-size: 42px;
            font-weight: 300;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 5px;
        }

        .price-lbl {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

            font-size: 11px;
            font-weight
