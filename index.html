<script>
        let currentCity = 'yvr';
        const SPUR_WHATSAPP_NUMBER = '14387251010';

        const cityData = {
            yvr: { enBadge: "Vancouver • Yaletown • Live", frBadge: "Vancouver • Yaletown • En Direct", areaName: "Yaletown, Vancouver" },
            yyz: { enBadge: "Toronto • Financial District • Live", frBadge: "Toronto • Quartier Financier • En Direct", areaName: "Financial District, Toronto" },
            yul: { enBadge: "Montreal • Plateau • Live", frBadge: "Montréal • Le Plateau • En Direct", areaName: "Le Plateau, Montréal" }
        };

        const SUPABASE_URL = 'https://quqcgjkbvajcltwuoqvz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_h-5S_3VCTLKsN8iVUc_LxQ_T7rn1HlJ';
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // REAL-TIME CLOUD SYNC (Matches 'last_specialist' column)
        async function checkReturningUserRealtime() {
            if (!supabaseClient) return;
            const savedPhone = localStorage.getItem('spur_user_phone');
            if (!savedPhone) return;
            try {
                const { data } = await supabaseClient
                    .from('clients')
                    .select('name, last_specialist')
                    .eq('phone', savedPhone)
                    .single();

                if (data) {
                    if (data.name) localStorage.setItem('spur_user_name', data.name);
                    if (data.last_specialist) localStorage.setItem('last_specialist', data.last_specialist);
                }
            } catch (err) {
                console.log("Supabase sync fallback active");
            }
        }

        async function syncClientToSupabase(name, phone, specialist) {
            if (!supabaseClient) return;
            try {
                await supabaseClient
                    .from('clients')
                    .upsert({ 
                        phone: phone, 
                        name: name, 
                        last_specialist: specialist 
                    }, { onConflict: 'phone' });
            } catch (err) {
                console.error("Supabase write error:", err);
            }
        }

        function alertCity(cityCode) {
            if (cityCode === 'yyz') {
                const nodeSelect = document.getElementById('spurtanNodeSelect');
                if (nodeSelect) nodeSelect.value = "Financial District, Toronto";
                safeOpenModal('spurtanModal');
            }
        }

        function switchModal(closeId, openId) {
            document.getElementById(closeId).style.display = 'none';
            safeOpenModal(openId);
        }

        function setCity(city) {
            if(city !== 'yvr' && city !== 'yul' && city !== 'yyz') return; 
            currentCity = city;
            document.getElementById('btn-yvr').classList.toggle('active', city === 'yvr');
            document.getElementById('btn-yyz').classList.toggle('active', city === 'yyz');
            document.getElementById('btn-yul').classList.toggle('active', city === 'yul');
            document.querySelectorAll('.formCityField').forEach(el => el.value = cityData[city].areaName);
            document.getElementById('receiptTargetArea').innerText = cityData[city].areaName;
            updateBadgeText();
            localStorage.setItem('spur_active_city', city);
        }

        function updateBadgeText() {
            const lang = localStorage.getItem('spur_lang') || 'en';
            document.getElementById('liveBadgeText').innerText = cityData[currentCity][lang === 'fr' ? 'frBadge' : 'enBadge'];
        }

        function switchLanguage(lang) {
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
            document.querySelectorAll('[data-en]').forEach(el => {
                if (el.id === 'brandPhilosophyText' && localStorage.getItem('spur_user_name')) return;
                el.innerHTML = lang === 'fr' && el.hasAttribute('data-fr') ? el.getAttribute('data-fr') : el.getAttribute('data-en');
            });
            const savedName = localStorage.getItem('spur_user_name');
            if (savedName) {
                const sub = document.getElementById('dynamicHeroSubtitle');
                if (sub) sub.innerHTML = lang === 'fr' ? "Bon retour, " + savedName.split(' ')[0] + "." : "Welcome back, " + savedName.split(' ')[0] + ".";
            }
            localStorage.setItem('spur_lang', lang);
            updateBadgeText();
        }

        let interceptTimer;
        let currentInterceptType = 'now';

        function openIntercept(type) {
            currentInterceptType = type;
            const modal = document.getElementById('interceptModal');
            const defaultView = document.getElementById('interceptDefaultView');
            const recognizedView = document.getElementById('interceptRecognizedView');
            
            // Reads exact 'last_specialist' matching Supabase schema
            const savedSpecialist = localStorage.getItem('last_specialist');

            if (savedSpecialist && savedSpecialist !== 'Fastest Available') {
                defaultView.style.display = 'none';
                recognizedView.style.display = 'block';
                document.getElementById('recognizedSpecialistText').innerText = `Book with ${savedSpecialist} again?`;
                document.getElementById('interceptStatusDesc').innerText = "Recognizing profile preferences...";
                clearTimeout(interceptTimer);
            } else {
                defaultView.style.display = 'block';
                recognizedView.style.display = 'none';
                document.getElementById('interceptStatusDesc').innerText = "Your concierge is coordinating verified specialist availability...";
                
                clearTimeout(interceptTimer);
                interceptTimer = setTimeout(() => {
                    if (modal.style.display === 'flex' && defaultView.style.display === 'block') {
                        skipIntercept();
                    }
                }, 3000);
            }

            modal.style.display = 'flex';
            
            const bar = document.getElementById('interceptProgressBar');
            bar.style.transition = 'none'; bar.style.width = '100%';
            void bar.offsetWidth;
            bar.style.transition = 'width 3s linear'; bar.style.width = '0%';
        }

        function confirmPreviousSpecialist() {
            clearTimeout(interceptTimer);
            const savedSpecialist = localStorage.getItem('last_specialist') || 'Fastest Available';
            document.querySelectorAll('.specialistHiddenField').forEach(el => el.value = savedSpecialist);
            document.getElementById('interceptModal').style.display = 'none';
            safeOpenModal(currentInterceptType === 'now' ? 'verifyModal' : 'laterModal');
        }

        function skipIntercept() {
            clearTimeout(interceptTimer);
            document.querySelectorAll('.specialistHiddenField').forEach(el => el.value = "Fastest Available");
            document.getElementById('interceptModal').style.display = 'none';
            safeOpenModal(currentInterceptType === 'now' ? 'verifyModal' : 'laterModal');
        }

        function safeOpenModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            if (id === 'verifyModal' || id === 'laterModal') {
                const savedName = localStorage.getItem('spur_user_name');
                const savedPhone = localStorage.getItem('spur_user_phone');
                const wrapper = id === 'verifyModal' ? document.getElementById('inputFieldsWrapper') : document.getElementById('inputFieldsWrapperLater');
                const resetBtn = id === 'verifyModal' ? document.getElementById('resetUserBtn') : document.getElementById('resetUserBtnLater');
                
                if (savedName && savedPhone) {
                    if(wrapper) wrapper.style.display = 'none';
                    if(wrapper) wrapper.querySelectorAll('input').forEach(i => i.required = false);
                    if(resetBtn) resetBtn.style.display = 'block';
                    const header = modal.querySelector('.dynamic-header');
                    if(header) header.innerText = "Welcome back, " + savedName.split(' ')[0];
                } else {
                    if(wrapper) wrapper.style.display = 'block';
                    if(resetBtn) resetBtn.style.display = 'none';
                    if(wrapper) wrapper.querySelectorAll('input').forEach(i => i.required = true);
                    const header = modal.querySelector('.dynamic-header');
                    if(header) header.innerText = id === 'verifyModal' ? "Get Ready Now" : "Plan Ahead";
                }
            }
            modal.style.display = 'flex';
        }

        function resetUser() {
            localStorage.removeItem('spur_user_name');
            localStorage.removeItem('spur_user_phone');
            localStorage.removeItem('last_specialist');
            alert("Profile reset. Please enter your details.");
            closeModals();
            safeOpenModal('verifyModal');
        }

        function closeModals() {
            clearTimeout(interceptTimer);
            document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
        }

        async function handleSpurtanRegister(event) {
            event.preventDefault();
            const form = event.target;
            const name = form.querySelector('input[name="client_name"]').value;
            const phone = form.querySelector('input[name="client_phone"]').value;
            
            localStorage.setItem('spur_user_name', name);
            localStorage.setItem('spur_user_phone', phone);
            localStorage.setItem('last_specialist', 'Fastest Available');
            await syncClientToSupabase(name, phone, 'Fastest Available');

            alert("✓ Founding Spurtan Access confirmed! Your $39.99 rate is now active.");
            
            document.getElementById('displayPrice').innerText = "$39.99 CAD";
            document.getElementById('finalReceiptPrice').innerText = "$39.99";
            
            const sub = document.getElementById('dynamicHeroSubtitle');
            if (sub) {
                sub.innerHTML = localStorage.getItem('spur_lang') === 'fr' ? "Bon retour, " + name.split(' ')[0] + "." : "Welcome back, " + name.split(' ')[0] + ".";
            }

            closeModals(); form.reset();
        }

        async function handleCodeSubmit(event) {
            event.preventDefault();
            const codeVal = document.getElementById('spurInput').value.trim().toUpperCase();
            if (codeVal.includes('SPUR')) {
                document.getElementById('displayPrice').innerText = "$39.99 CAD";
                document.getElementById('finalReceiptPrice').innerText = "$39.99";
                alert("✓ Code applied! (-$10.00)");
                closeModals(); event.target.reset();
            } else {
                alert("Please enter a valid code.");
            }
        }

        async function handleSubmit(event, type) {
            event.preventDefault();
            const form = event.target;
            let name = localStorage.getItem('spur_user_name');
            let phone = localStorage.getItem('spur_user_phone');

            const nameInput = form.querySelector('input[name="client_name"]');
            const phoneInput = form.querySelector('input[name="client_phone"]');

            if (nameInput && nameInput.value.trim()) {
                name = nameInput.value.trim();
                localStorage.setItem('spur_user_name', name);
            }
            if (phoneInput && phoneInput.value.trim().length >= 10) {
                phone = phoneInput.value.trim();
                localStorage.setItem('spur_user_phone', phone);
            }

            if (!name) name = 'Valued Client';
            if (!phone) phone = '6040000000';

            const city = form.querySelector('.formCityField').value;
            const contextRaw = form.querySelector('select[name="service_context"]').value;
            const context = contextRaw ? contextRaw.split('—')[0].trim() : 'Standard Readiness';
            const specialist = form.querySelector('input[name="requested_specialist"]')?.value || 'Fastest Available';

            localStorage.setItem('last_specialist', specialist);
            await syncClientToSupabase(name, phone, specialist);

            const waMessage = `Hello SPUR — I would like to request a visit.\n\nType: ${type.toUpperCase()}\nCity: ${city}\nName: ${name}\nMobile: ${phone}\nContext: ${context}\nSpecialist: ${specialist}\n\nPlease coordinate verified availability.`;
            const encodedWaUrl = `https://wa.me/${SPUR_WHATSAPP_NUMBER}?text=${encodeURIComponent(waMessage)}`;
            document.getElementById('whatsappAutoBtn').href = encodedWaUrl;

            try { await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } }); } catch (e) {}

            closeModals();
            document.getElementById('mainAppContainer').style.display = 'none';
            document.getElementById('finalSuccessView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setCity(localStorage.getItem('spur_active_city') || 'yvr');
            switchLanguage(localStorage.getItem('spur_lang') || 'en');
            await checkReturningUserRealtime();
            
            const savedName = localStorage.getItem('spur_user_name');
            const sub = document.getElementById('dynamicHeroSubtitle');
            if (savedName && sub) {
                const lang = localStorage.getItem('spur_lang') || 'en';
                sub.innerHTML = lang === 'fr' ? "Bon retour, " + savedName.split(' ')[0] + "." : "Welcome back, " + savedName.split(' ')[0] + ".";
            }
        });
    </script>
